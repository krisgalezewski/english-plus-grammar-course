<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard | English+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   English+ Grammar Course — Shared Theme
   Design tokens + reusable component styles for all 22 lessons.
   Loaded by every lesson-*.html via <link rel="stylesheet">.
   ============================================================ */

:root{
  /* Surfaces */
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --surface-alt:#EEF1F5;
  --border:#DFE3E9;
  --border-strong:#C7CDD6;

  /* Text */
  --text:#1B2430;
  --text-secondary:#5B6472;
  --text-tertiary:#8A93A1;

  /* Accent (matches existing English+ lesson pages) */
  --accent:#185FA5;
  --accent-dark:#0C4577;
  --accent-soft:#E6F1FB;
  --accent-soft-border:#85B7EB;

  /* Feedback */
  --ok:#27500A;
  --ok-bg:#EAF3DE;
  --ok-border:#C0DD97;
  --bad:#791F1F;
  --bad-bg:#FCEBEB;
  --bad-border:#F7C1C1;
  --warn:#633806;
  --warn-bg:#FAEEDA;
  --warn-border:#E8C080;

  /* Grammar-concept colour coding — kept consistent across the whole
     course so students learn to associate a colour with a concept
     family (same convention as the existing Verb Tenses lesson) */
  --c-present:#0F6E56;
  --c-present-bg:#E4F3EE;
  --c-continuous:#534AB7;
  --c-continuous-bg:#ECEAFA;
  --c-past:#185FA5;
  --c-future:#993C1D;
  --c-modal:#854F0B;

  /* Type */
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;

  /* Shape */
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --radius-pill:999px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:var(--font-sans);
  color:var(--text);
  background:var(--bg);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,h4{font-weight:650;letter-spacing:-0.01em}

.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* ---------- Layout ---------- */
.shell{max-width:760px;margin:0 auto;padding:28px 20px 80px}

.lesson-header{margin-bottom:20px}
.lesson-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;
}
.lesson-title{font-size:26px;line-height:1.25;margin-bottom:6px;color:var(--accent-dark)}
.lesson-sub{font-size:14.5px;color:var(--text-secondary)}
.course-attribution{
  text-align:center;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-tertiary);padding:14px 20px 0;
}

/* ---------- Per-section colour themes ----------
   Every widget/button/hover-state throughout the course reads colour
   purely from --accent/--accent-dark/--accent-soft/--accent-soft-border
   (and the page background from --bg), so overriding just these four
   variables per section re-colours the whole page — buttons, toggles,
   compare-card hovers, formula boxes' border-left accents that use
   --accent directly, everything — with zero changes needed to any
   lesson's own JS/CSS. The tense-specific concept colours (--c-present,
   --c-continuous, etc., used to distinguish tenses *within* a lesson)
   are deliberately left untouched — those stay consistent across every
   section since a student learns "green = present tense" regardless of
   which part of the course they're in. */
body.theme-tenses{
  --accent:#A3392A; --accent-dark:#7C2B1F; --accent-soft:#F7EBE9; --accent-soft-border:#DDA99E; --bg:#FBF7F6;
}
body.theme-modals{
  --accent:#2E7A82; --accent-dark:#215A60; --accent-soft:#E9F3F4; --accent-soft-border:#A0CDD1; --bg:#F5FAFA;
}
body.theme-conditionals{
  --accent:#4A7A3D; --accent-dark:#365A2C; --accent-soft:#EEF4EC; --accent-soft-border:#B3D1A8; --bg:#F7FAF6;
}
body.theme-reported{
  --accent:#B8842E; --accent-dark:#8C6321; --accent-soft:#FAF3E7; --accent-soft-border:#E4C48F; --bg:#FDFAF6;
}

.section{margin-bottom:36px}
.section-label{
  display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  color:var(--text-tertiary);margin-bottom:12px;
}
.section-label .num{
  width:22px;height:22px;border-radius:50%;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--text-secondary);flex-shrink:0;
}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:1.3rem 1.5rem;
  margin-bottom:.9rem;
}
.card + .card{margin-top:.9rem}

.tip-box{
  background:var(--surface-alt);border-radius:var(--radius-md);
  padding:11px 15px;font-size:13.5px;color:var(--text-secondary);
  display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;line-height:1.6;margin-top:10px;
}
.tip-box > *{min-width:0}
.warn-box{
  background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-md);
  padding:11px 15px;font-size:13.5px;color:var(--warn);
  display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start;line-height:1.6;margin-top:10px;
}
.warn-box > *{min-width:0}

/* ---------- Buttons / pills ---------- */
.btn{
  font-family:inherit;font-size:14px;padding:9px 20px;border-radius:var(--radius-pill);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  cursor:pointer;transition:all .15s;
}
.btn:hover{background:var(--surface-alt)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--surface-alt);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:12.5px}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--border-strong);background:var(--surface);
  font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.pill:hover{background:var(--surface-alt)}
.pill.on{color:#fff;border-color:transparent;background:var(--accent)}
.pill.on.c-present{background:var(--c-present)}
.pill.on.c-continuous{background:var(--c-continuous)}

/* ---------- Progress bar ---------- */
.pb-track{background:var(--surface-alt);border-radius:var(--radius-pill);height:6px;overflow:hidden}
.pb-fill{height:6px;border-radius:var(--radius-pill);background:var(--accent);transition:width .35s}

/* ---------- Formula box ---------- */
.formula{
  font-family:var(--font-mono);font-size:13px;background:var(--surface-alt);
  border-radius:var(--radius-md);padding:11px 15px;border-left:3px solid var(--accent);
  margin-bottom:8px;line-height:1.7;color:var(--text);
}

/* ---------- Multiple choice / gap-fill options ---------- */
.opt{
  display:block;width:100%;padding:11px 16px;border-radius:var(--radius-md);
  border:1px solid var(--border-strong);background:var(--surface);
  font-size:14.5px;font-family:inherit;text-align:left;cursor:pointer;
  transition:all .15s;color:var(--text);line-height:1.5;margin-bottom:8px;
}
.opt:last-child{margin-bottom:0}
.opt:hover:not(.sel):not(.ok):not(.bad):not(.dim){background:var(--surface-alt)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark);font-weight:550}
.opt.ok{border-color:var(--ok-border);background:var(--ok-bg);color:var(--ok);font-weight:550;cursor:default;pointer-events:none}
.opt.bad{border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad);cursor:default;pointer-events:none}
.opt.dim{opacity:.5;cursor:default;pointer-events:none}

.fb-ok{background:var(--ok-bg);color:var(--ok);font-size:13.5px;padding:11px 15px;border-radius:var(--radius-sm);margin-top:10px;line-height:1.6}
.fb-no{background:var(--bad-bg);color:var(--bad);font-size:13.5px;padding:11px 15px;border-radius:var(--radius-sm);margin-top:10px;line-height:1.6}

/* ---------- Reading passage + vocab ---------- */
.passage{
  font-family:var(--font-serif);font-size:16px;line-height:1.85;color:var(--text);
}
.passage p{margin-bottom:14px}
.vocab{
  color:var(--accent-dark);background:var(--accent-soft);
  padding:1px 4px;border-radius:5px;cursor:pointer;font-weight:550;
  border-bottom:1.5px dotted var(--accent-soft-border);transition:all .12s;
}
.vocab:hover{background:#D6E9FA}

.vocab-pop{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:1.1rem 1.3rem;margin-top:10px;box-shadow:0 8px 28px rgba(20,30,50,.10);
  display:none;font-family:var(--font-sans);
}
.vocab-pop.open{display:block}
.vocab-pop-word{font-size:17px;font-weight:650;margin-bottom:2px}
.vocab-pop-ipa{font-family:var(--font-mono);font-size:13px;color:var(--text-secondary);margin-bottom:10px}
.audio-btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-pill);
  border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;
  font-size:12.5px;color:var(--text-secondary);transition:all .15s;margin-bottom:10px;
}
.audio-btn:hover{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent)}
.audio-btn.playing{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:550}
.vocab-pop-ex{font-size:14px;color:var(--text-secondary);font-style:italic;line-height:1.6;margin-bottom:10px}
.glossary-btn{font-size:12px}

/* ---------- Sentence builder (drag/tap-to-order) ---------- */
.builder-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:40px}
.chip{
  padding:8px 14px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);
  background:var(--surface);font-size:14px;cursor:pointer;transition:all .15s;
}
.chip:hover{background:var(--surface-alt)}
.chip.used{opacity:.35;pointer-events:none}
.builder-target{
  display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius-md);background:var(--surface-alt);
}
.builder-target .chip{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-dark)}

/* ---------- Speaking / listening task cards ---------- */
.task-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem 1.4rem;
  background:linear-gradient(180deg,var(--surface) 0%,var(--surface-alt) 130%);
}
.task-card .kicker{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:6px}
.mode-toggle{display:flex;gap:8px;margin-bottom:14px}

/* ---------- Grammar-in-text highlight (toggle) ---------- */
.gram{cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.passage.show-grammar .gram{background:var(--warn-bg);border-bottom-color:var(--c-modal);border-radius:3px;padding:0 2px}
.passage:not(.show-grammar) .gram{pointer-events:none}
.gram-explain{background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius-md);padding:11px 15px;font-size:13.5px;color:var(--warn);line-height:1.6;margin-top:10px;display:none}
.gram-explain.open{display:block}

/* ---------- Listening transcript ---------- */
.transcript-line{
  font-size:14.5px;line-height:1.8;padding:6px 0;opacity:0;transform:translateY(4px);
  transition:opacity .3s,transform .3s;
}
.transcript-line.shown{opacity:1;transform:translateY(0)}
.transcript-line b{color:var(--accent)}
.transcript-line.active{background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:0 -10px}

/* ---------- Discussion question picker (speaking task) ---------- */
.discuss-q{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:12px 15px;border-radius:var(--radius-md);border:1px solid var(--border-strong);
  background:var(--surface);cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.6;
  color:var(--text);transition:all .15s;
}
.discuss-q:hover{background:var(--surface-alt)}
.discuss-q .chk{
  flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;margin-top:1px;
}
.discuss-q.picked{border-color:var(--accent);background:var(--accent-soft)}
.discuss-q.picked .chk{background:var(--accent);border-color:var(--accent)}
.discuss-q.disabled{opacity:.45;cursor:not-allowed}

/* ---------- Print-to-PDF report ---------- */
#course-print-report{display:none}
@media print{
  body > *:not(#course-print-report){display:none !important}
  #course-print-report{
    display:block !important;
    font-family:Arial,Helvetica,sans-serif;color:#1B2430;
    max-width:680px;margin:0 auto;padding:20px;
  }
}

/* ---------- Shared popup (vocab, grammar, stative verbs) ---------- */
.course-popup-backdrop{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;z-index:9998}
.course-popup-box{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--surface);border-radius:var(--radius-lg);box-shadow:0 24px 64px rgba(20,30,50,.28);
  padding:1.5rem 1.7rem;max-width:420px;width:calc(100% - 40px);max-height:80vh;overflow-y:auto;
  display:none;z-index:9999;
}
#course-popup-root.open .course-popup-backdrop{display:block}
#course-popup-root.open .course-popup-box{display:block}
.course-popup-close{
  position:absolute;top:8px;right:10px;background:none;border:none;font-size:22px;line-height:1;
  cursor:pointer;color:var(--text-tertiary);padding:5px 9px;border-radius:7px;transition:all .15s;
}
.course-popup-close:hover{background:var(--surface-alt);color:var(--text)}

/* ---------- Stative verb tricky cases (stative vs dynamic) ---------- */
.tricky-pair{border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px}
.tricky-pair:last-child{margin-bottom:0}
.tricky-word{font-weight:650;margin-bottom:8px;font-size:14.5px}
.tricky-row{font-size:13.5px;line-height:1.6;margin-bottom:5px;display:flex;gap:8px;align-items:baseline}
.tricky-row:last-child{margin-bottom:0}
.tricky-row .audio-btn{padding:2px 8px;font-size:11px;margin-bottom:0}
.tricky-example{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--border-strong);transition:color .15s}
.tricky-example:hover{color:var(--accent)}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 7px;border-radius:5px;flex-shrink:0}
.tag.stative{background:var(--c-present-bg);color:var(--c-present)}
.tag.dynamic{background:var(--c-continuous-bg);color:var(--c-continuous)}

/* ---------- Expandable "full rules" content ---------- */
.expand-content{display:none}
.expand-content.open{display:block}

/* ---------- Stative verb groups ---------- */
.verb-group{margin-bottom:18px}
.verb-group:last-child{margin-bottom:0}
.verb-group-title{font-size:12.5px;font-weight:650;text-transform:uppercase;letter-spacing:.03em;color:var(--text-tertiary);margin-bottom:10px}
.verb-chip{
  display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-family:inherit;
  cursor:pointer;transition:all .15s;margin:0 8px 8px 0;color:var(--text);
}
.verb-chip:hover{background:var(--accent-soft);border-color:var(--accent-soft-border);color:var(--accent-dark)}
.verb-chip .star{color:var(--c-modal);font-weight:700}

/* ---------- Finish/summary feedback ---------- */
@keyframes summary-pulse {
  0% { box-shadow: 0 0 0 0 rgba(24,95,165,0.35); }
  70% { box-shadow: 0 0 0 14px rgba(24,95,165,0); }
  100% { box-shadow: 0 0 0 0 rgba(24,95,165,0); }
}
.summary-pulse{ animation: summary-pulse 1.1s ease-out; }
.error-banner{
  background:var(--bad-bg);border:1px solid var(--bad-border);color:var(--bad);
  border-radius:var(--radius-md);padding:12px 16px;font-size:13.5px;margin-top:10px;line-height:1.6;
}

/* ---------- Find-the-error (click the wrong word) ---------- */
.err-word{cursor:pointer;padding:1px 4px;border-radius:5px;transition:all .12s}
.err-word:hover{background:var(--surface-alt)}
.err-word.err-target{background:var(--ok-bg);color:var(--ok);font-weight:600}
.err-word.err-wrong-pick{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}

/* ---------- Matching (click left, then right) ---------- */
.match-item{
  width:100%;text-align:left;padding:10px 14px;border-radius:var(--radius-md);
  border:1px solid var(--border-strong);background:var(--surface);font-size:13.5px;
  font-family:inherit;cursor:pointer;transition:all .12s;line-height:1.5;
}
.match-item:hover:not(:disabled){background:var(--surface-alt)}
.match-item.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-dark)}
.match-item.match-correct{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.match-item.match-wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-border)}

/* ---------- Score summary ---------- */
.score-ring{
  width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:650;font-size:15px;background:var(--accent-soft);color:var(--accent-dark);flex-shrink:0;
}
.summary-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}

@media (max-width:520px){
  .shell{padding:20px 16px 64px}
  .lesson-title{font-size:22px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

</style>

  }
  .answer-cell:hover{outline:1.5px solid var(--border-strong)}
  .answer-cell.correct{background:var(--ok-bg);color:var(--ok)}
  .answer-cell.incorrect{background:var(--bad-bg);color:var(--bad)}
  .answer-cell.revised{outline:2px solid var(--accent)}
  .answer-cell.empty{color:var(--text-tertiary);background:var(--surface-alt);cursor:default}
  .answer-cell .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .oral-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px}
  .oral-q{font-size:14px;font-weight:550;margin-bottom:10px}
  .oral-student-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--surface-alt)}
  .oral-student-row:first-of-type{border-top:none}
  .verdict-btns{display:flex;gap:6px}
  .verdict-btn{font-size:11px;padding:4px 10px}
  .verdict-btn.pass.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .verdict-btn.needs.on{background:var(--bad);color:#fff;border-color:var(--bad)}

  .join-prompt{text-align:center;padding:60px 20px}
</style>
</head>
<body>

<div class="shell">
  <header class="lesson-header">
    <div class="lesson-eyebrow">👩‍🏫 Teacher view</div>
    <h1 class="lesson-title" id="dash-title">Teacher Dashboard</h1>
    <p class="lesson-sub" id="dash-sub">Loading…</p>
    <select id="lesson-select" style="margin-top:10px;border:1px solid var(--border-strong);border-radius:var(--radius-pill);padding:8px 16px;font-family:inherit;font-size:13.5px;background:var(--surface);display:none"></select>
  </header>

  <div id="join-prompt" class="join-prompt" style="display:none">
    <p style="margin-bottom:14px;color:var(--text-secondary)">Which group's session do you want to open?</p>
    <input id="join-input" type="text" placeholder="e.g. tues6pm-x7k2p9" style="border:1px solid var(--border-strong);border-radius:8px;padding:9px 14px;font-family:inherit;width:240px;text-align:center">
    <br><button class="btn btn-primary" id="join-btn" style="margin-top:12px">Open dashboard</button>
  </div>

  <div id="dash-body" style="display:none">
    <section class="section">
      <div class="section-label"><span class="num">1</span> Roster &amp; live progress</div>
      <div class="roster" id="roster"></div>
    </section>

    <section class="section">
      <div class="section-label"><span class="num">2</span> Reveal panel — click any answer to override it live</div>
      <div id="reveal-root"></div>
    </section>

    <section class="section">
      <div class="section-label"><span class="num">3</span> Speaking tasks</div>
      <div id="oral-root"></div>
    </section>
  </div>
</div>

<script>
const LESSONS = [
  { id: 'lesson-01-present-simple-vs-continuous', title: 'Lesson 1 — Present Simple vs. Present Continuous' },
  { id: 'lesson-02-past-simple-vs-continuous', title: 'Lesson 2 — Past Simple vs. Past Continuous' },
  { id: 'lesson-03-present-perfect-vs-past-simple', title: 'Lesson 3 — Present Perfect vs. Past Simple' },
  { id: 'test-01-review-lessons-1-3', title: 'Test 1 — Review of Lessons 1–3' },
  { id: 'lesson-04-present-perfect-simple-vs-continuous', title: 'Lesson 4 — Present Perfect Simple vs. Present Perfect Continuous' },
  { id: 'lesson-05-past-perfect-simple-vs-continuous', title: 'Lesson 5 — Past Perfect Simple vs. Past Perfect Continuous' },
  { id: 'lesson-06-future-forms', title: 'Lesson 6 — Will vs. Going To vs. Present Continuous' },
  { id: 'test-02-review-lessons-4-6', title: 'Test 2 — Review of Lessons 4–6' },
  { id: 'lesson-07-future-perfect-vs-continuous', title: 'Lesson 7 — Future Perfect vs. Future Continuous' },
  { id: 'lesson-08-modals-ability-permission-obligation', title: 'Lesson 8 — Modals of Ability, Permission, Obligation, and Prohibition' },
  { id: 'lesson-09-modals-deduction-speculation', title: 'Lesson 9 — Modals of Deduction and Speculation' },
  { id: 'test-03-review-lessons-7-9', title: 'Test 3 — Review of Lessons 7–9' },
  { id: 'lesson-10-modal-perfect', title: 'Lesson 10 — Modal Perfect: Should Have, Could Have, Would Have' },
  { id: 'lesson-11-passive-voice', title: 'Lesson 11 — Passive Voice: Core Forms Across Tenses' },
  { id: 'big-test-1-review-lessons-1-11', title: 'Big Test 1 — Review of Lessons 1–11' },
  { id: 'lesson-12-passive-extensions', title: 'Lesson 12 — Passive Extensions: Reporting Structures & Causative' },
  { id: 'lesson-13-conditionals-zero-first', title: 'Lesson 13 — Conditionals: Zero & First' },
  { id: 'lesson-14-second-conditional', title: 'Lesson 14 — Second Conditional' },
  { id: 'test-04-review-lessons-12-14', title: 'Test 4 — Review of Lessons 12–14' },
  { id: 'lesson-15-third-conditional', title: 'Lesson 15 — Third Conditional' },
  { id: 'lesson-16-mixed-conditionals', title: 'Lesson 16 — Mixed Conditionals' },
  { id: 'lesson-17-wish-if-only', title: 'Lesson 17 — Wish / If Only' },
  { id: 'test-05-review-lessons-15-17', title: 'Test 5 — Review of Lessons 15–17' },
  { id: 'lesson-18-reported-speech', title: 'Lesson 18 — Reported Speech' },
  { id: 'lesson-19-relative-clauses', title: 'Lesson 19 — Relative Clauses' },
  { id: 'lesson-20-gerunds-vs-infinitives', title: 'Lesson 20 — Gerunds vs. Infinitives' },
  { id: 'test-06-review-lessons-18-20', title: 'Test 6 — Review of Lessons 18–20' },
  { id: 'lesson-21-articles-determiners', title: 'Lesson 21 — Articles & Determiners' },
  { id: 'lesson-22-discourse-emphasis-capstone', title: 'Lesson 22 — Discourse & Emphasis Capstone' }
];
let currentLessonId = LESSONS[0].id;
function currentLessonTitle(){
  return LESSONS.find(l => l.id === currentLessonId)?.title || currentLessonId;
}

// Human-readable labels + display order for known sections. Anything not
// listed here still shows up (grouped under "Other"), just unordered —
// so this dashboard never silently hides a new exercise added later.
const SECTION_LABELS = {
  'warmup-1':'Warm-up 1','warmup-2':'Warm-up 2','warmup-3':'Warm-up 3',
  'diagnostic-1':'Diagnostic 1','diagnostic-2':'Diagnostic 2','diagnostic-3':'Diagnostic 3','diagnostic-4':'Diagnostic 4',
  'reading-comprehension-1':'Comprehension 1','reading-comprehension-2':'Comprehension 2','reading-comprehension-3':'Comprehension 3',
  'vocab-1':'Vocab 1','vocab-2':'Vocab 2','vocab-3':'Vocab 3','vocab-4':'Vocab 4','vocab-5':'Vocab 5',
  'vocab-gapfill-1':'Vocab gap-fill 1','vocab-gapfill-2':'Vocab gap-fill 2','vocab-gapfill-3':'Vocab gap-fill 3','vocab-gapfill-4':'Vocab gap-fill 4',
  'practice-gapfill-1':'Gap-fill 1','practice-gapfill-2':'Gap-fill 2','practice-gapfill-3':'Gap-fill 3','practice-gapfill-4':'Gap-fill 4','practice-gapfill-5':'Gap-fill 5','practice-gapfill-6':'Gap-fill 6',
  'practice-error-1':'Sentence pair 1','practice-error-2':'Sentence pair 2','practice-error-3':'Sentence pair 3','practice-error-4':'Sentence pair 4',
  'practice-oddone-1':'Odd one out 1','practice-oddone-2':'Odd one out 2','practice-oddone-3':'Odd one out 3','practice-oddone-4':'Odd one out 4',
  'practice-sequence-1':'Event sequencer',
  'practice-sequence-connect-1':'Sequencer: describe it 1','practice-sequence-connect-2':'Sequencer: describe it 2','practice-sequence-connect-3':'Sequencer: describe it 3',
  'practice-fixai-1':'Fix the AI 1','practice-fixai-2':'Fix the AI 2','practice-fixai-3':'Fix the AI 3','practice-fixai-4':'Fix the AI 4','practice-fixai-5':'Fix the AI 5',
  'practice-categorise-1':'Categorise 1','practice-categorise-2':'Categorise 2','practice-categorise-3':'Categorise 3','practice-categorise-4':'Categorise 4','practice-categorise-5':'Categorise 5','practice-categorise-6':'Categorise 6','practice-categorise-7':'Categorise 7','practice-categorise-8':'Categorise 8',
  'practice-builder-1':'Sentence builder 1','practice-builder-2':'Sentence builder 2','practice-builder-3':'Sentence builder 3',
  'listening-1':'Listening 1','listening-2':'Listening 2','listening-3':'Listening 3',
  'exit-1':'Exit check 1','exit-2':'Exit check 2','exit-3':'Exit check 3','exit-4':'Exit check 4','exit-5':'Exit check 5'
};
const SECTION_GROUPS = [
  { title:'Warm-up & diagnostic', prefixes:['warmup-','diagnostic-'] },
  { title:'Reading comprehension', prefixes:['reading-comprehension-'] },
  { title:'Vocabulary', prefixes:['vocab-'] },
  { title:'Grammar practice', prefixes:['practice-'] },
  { title:'Listening', prefixes:['listening-'] },
  { title:'Exit check', prefixes:['exit-'] }
];

function getParam(name){ return new URLSearchParams(window.location.search).get(name); }

let supabaseClient = null;
try {
  if (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY){
    supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  }
} catch(e){ console.error(e); }

let GROUP_ID = getParam('group');
let allRows = [];       // every lesson_progress row for this group (all lessons)
let studentNames = [];
let absentStudents = new Set(); // local-only for now, see note in chat

function esc(s){ return (s ?? '').toString().replace(/</g,'&lt;'); }

/* ---------------- DATA: latest attempt per student+section ---------------- */
function currentRowsFor(lessonId){
  const rows = allRows.filter(r => r.lesson_id === lessonId);
  const latest = {};
  rows.forEach(r => {
    const key = r.student_name + '::' + r.section_id;
    const existing = latest[key];
    if (!existing || new Date(r.created_at) >= new Date(existing.created_at)) latest[key] = r;
  });
  return Object.values(latest);
}

/* ---------------- RENDER: roster ---------------- */
function renderRoster(){
  const rows = currentRowsFor(currentLessonId).filter(r => r.exercise_type === 'auto_graded');
  const root = document.getElementById('roster');
  root.innerHTML = '';
  studentNames.forEach(name => {
    const mine = rows.filter(r => r.student_name === name);
    const correct = mine.filter(r => (r.override_correct ?? r.is_correct)).length;
    const card = document.createElement('div');
    card.className = 'roster-card' + (absentStudents.has(name) ? ' absent' : '');
    card.innerHTML = `
      <div class="name">${esc(name)}</div>
      <div class="count">${mine.length} answered · ${correct} correct</div>
      <button class="btn absent-toggle ${absentStudents.has(name) ? 'btn-primary' : 'btn-ghost'}" data-name="${esc(name)}">
        ${absentStudents.has(name) ? '✓ Marked absent' : 'Mark absent'}
      </button>
      <button class="btn btn-ghost wipe-btn" data-name="${esc(name)}">🗑 Wipe answers</button>
    `;
    card.querySelector('.absent-toggle').addEventListener('click', () => {
      if (absentStudents.has(name)) absentStudents.delete(name); else absentStudents.add(name);
      renderRoster();
    });
    card.querySelector('.wipe-btn').addEventListener('click', () => wipeStudent(name));
    root.appendChild(card);
  });
}

/* ---------------- WIPE (real, permanent delete) ---------------- */
async function wipeStudent(name){
  const confirmed = confirm(`Permanently delete ALL of ${name}'s answers for "${currentLessonTitle()}" from Supabase? This cannot be undone, and does not affect their own device — they'll simply start re-answering from scratch next time they open this lesson.`);
  if (!confirmed) return;
  allRows = allRows.filter(r => !(r.student_name === name && r.lesson_id === currentLessonId)); // optimistic
  renderAll();
  if (!supabaseClient) return;
  const { error } = await supabaseClient.from('lesson_progress').delete()
    .eq('group_id', GROUP_ID).eq('student_name', name).eq('lesson_id', currentLessonId);
  if (error) console.warn('Wipe failed:', error.message);
}

/* ---------------- RENDER: reveal panel ---------------- */
async function overrideAnswer(row, newValue){
  row.override_correct = newValue; // optimistic local update
  renderReveal();
  if (!supabaseClient || !row.id) return;
  const { error } = await supabaseClient.from('lesson_progress').update({ override_correct: newValue }).eq('id', row.id);
  if (error) console.warn('Override failed to save:', error.message);
}

function renderReveal(){
  const rows = currentRowsFor(currentLessonId).filter(r => r.exercise_type === 'auto_graded');
  const bySection = {};
  rows.forEach(r => { (bySection[r.section_id] = bySection[r.section_id] || []).push(r); });

  const root = document.getElementById('reveal-root');
  root.innerHTML = '';
  const usedSections = new Set();

  SECTION_GROUPS.forEach(group => {
    const sectionIds = Object.keys(bySection).filter(sid => group.prefixes.some(p => sid.startsWith(p)));
    if (!sectionIds.length) return;
    sectionIds.sort();
    const wrap = document.createElement('div');
    wrap.className = 'reveal-section';
    wrap.innerHTML = `<div class="reveal-section-title">${group.title}</div>`;
    const table = document.createElement('table');
    table.className = 'reveal-table';
    table.innerHTML = `<thead><tr><th>Question</th>${studentNames.map(n => `<th>${esc(n)}</th>`).join('')}</tr></thead><tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    sectionIds.forEach(sid => {
      usedSections.add(sid);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="section-id">${SECTION_LABELS[sid] || sid}</td>`;
      studentNames.forEach(name => {
        const row = bySection[sid].find(r => r.student_name === name);
        const td = document.createElement('td');
        if (!row){
          td.innerHTML = `<span class="answer-cell empty">—</span>`;
        } else {
          const ok = row.override_correct ?? row.is_correct;
          const wasOverridden = row.override_correct !== null && row.override_correct !== undefined;
          const cell = document.createElement('span');
          cell.className = `answer-cell ${ok ? 'correct' : 'incorrect'}${wasOverridden ? ' revised' : ''}`;
          cell.innerHTML = `<span>${ok ? '✓' : '✗'}</span><span class="txt">${esc(row.answer_given)}</span>`;
          cell.title = 'Click to flip correct/incorrect';
          cell.addEventListener('click', () => overrideAnswer(row, !ok));
          td.appendChild(cell);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    root.appendChild(wrap);
  });

  // Anything not covered by a known group still shows up, so nothing is silently hidden.
  const leftover = Object.keys(bySection).filter(sid => !usedSections.has(sid));
  if (leftover.length){
    const wrap = document.createElement('div');
    wrap.className = 'reveal-section';
    wrap.innerHTML = `<div class="reveal-section-title">Other</div>`;
    const table = document.createElement('table');
    table.className = 'reveal-table';
    table.innerHTML = `<thead><tr><th>Question</th>${studentNames.map(n => `<th>${esc(n)}</th>`).join('')}</tr></thead><tbody></tbody>`;
    const tbody = table.querySelector('tbody');
    leftover.sort().forEach(sid => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="section-id">${sid}</td>`;
      studentNames.forEach(name => {
        const row = bySection[sid].find(r => r.student_name === name);
        const td = document.createElement('td');
        if (!row){ td.innerHTML = `<span class="answer-cell empty">—</span>`; }
        else {
          const ok = row.override_correct ?? row.is_correct;
          const cell = document.createElement('span');
          cell.className = `answer-cell ${ok ? 'correct' : 'incorrect'}`;
          cell.innerHTML = `<span>${ok ? '✓' : '✗'}</span><span class="txt">${esc(row.answer_given)}</span>`;
          cell.addEventListener('click', () => overrideAnswer(row, !ok));
          td.appendChild(cell);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    root.appendChild(wrap);
  }
}

/* ---------------- RENDER: oral / discussion picks ---------------- */
async function setVerdict(row, verdict){
  if (!row.id) return;
  row.teacher_verdict = row.teacher_verdict === verdict ? null : verdict; // click again to clear
  renderOral();
  if (!supabaseClient) return;
  const { error } = await supabaseClient.from('lesson_progress').update({ teacher_verdict: row.teacher_verdict }).eq('id', row.id);
  if (error) console.warn('Verdict failed to save:', error.message);
}

function renderOral(){
  const rows = currentRowsFor(currentLessonId).filter(r => r.exercise_type === 'oral' && r.status === 'completed');
  const bySection = {};
  rows.forEach(r => { (bySection[r.section_id] = bySection[r.section_id] || []).push(r); });

  const root = document.getElementById('oral-root');
  root.innerHTML = '';
  const sectionIds = Object.keys(bySection).sort();
  if (!sectionIds.length){
    root.innerHTML = `<p style="font-size:13.5px;color:var(--text-tertiary)">No speaking tasks completed yet.</p>`;
    return;
  }
  sectionIds.forEach(sid => {
    const picks = bySection[sid];
    const card = document.createElement('div');
    card.className = 'oral-card';
    card.innerHTML = `<div class="oral-q">${esc(picks[0].answer_given)}</div>`;
    picks.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'oral-student-row';
      rowEl.innerHTML = `
        <span style="font-size:13.5px;font-weight:550">${esc(row.student_name)}</span>
        <span class="verdict-btns">
          <button class="btn verdict-btn pass ${row.teacher_verdict === 'pass' ? 'on' : ''}">✓ Pass</button>
          <button class="btn verdict-btn needs ${row.teacher_verdict === 'needs work' ? 'on' : ''}">Needs work</button>
        </span>
      `;
      rowEl.querySelector('.pass').addEventListener('click', () => setVerdict(row, 'pass'));
      rowEl.querySelector('.needs').addEventListener('click', () => setVerdict(row, 'needs work'));
      card.appendChild(rowEl);
    });
    root.appendChild(card);
  });
}

function renderAll(){ renderRoster(); renderReveal(); renderOral(); }

/* ---------------- LOAD + REALTIME ---------------- */
async function loadGroup(groupId){
  GROUP_ID = groupId;
  document.getElementById('dash-title').textContent = `Teacher Dashboard — ${groupId}`;
  document.getElementById('join-prompt').style.display = 'none';
  document.getElementById('dash-body').style.display = 'block';
  document.getElementById('dash-sub').textContent = `Watching "${currentLessonTitle()}" live`;

  const select = document.getElementById('lesson-select');
  select.innerHTML = LESSONS.map(l => `<option value="${l.id}">${l.title}</option>`).join('');
  select.value = currentLessonId;
  select.style.display = 'inline-block';
  select.addEventListener('change', () => {
    currentLessonId = select.value;
    document.getElementById('dash-sub').textContent = `Watching "${currentLessonTitle()}" live`;
    renderAll();
  });

  if (!supabaseClient){
    document.getElementById('dash-sub').textContent = 'Supabase isn\'t connected — check shared/supabase-config.js.';
    return;
  }

  const { data: groupRow, error: groupErr } = await supabaseClient.from('groups').select('student_names').eq('group_id', groupId).maybeSingle();
  if (groupErr) console.warn(groupErr.message);
  studentNames = groupRow ? groupRow.student_names : [];

  const { data: rows, error: rowsErr } = await supabaseClient.from('lesson_progress').select('*').eq('group_id', groupId);
  if (rowsErr) console.warn(rowsErr.message);
  allRows = rows || [];
  // students who've answered but aren't (yet) in groups.student_names shouldn't be invisible
  allRows.forEach(r => { if (!studentNames.includes(r.student_name)) studentNames.push(r.student_name); });

  renderAll();

  supabaseClient.channel(`dash-${groupId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'lesson_progress', filter: `group_id=eq.${groupId}` }, (payload) => {
      if (payload.eventType === 'DELETE'){
        // DELETE events only populate payload.old, never payload.new — easy to
        // miss, and without this branch a wipe from another tab/device would
        // silently fail to disappear from this dashboard until manual reload.
        const oldId = payload.old?.id;
        if (oldId != null) allRows = allRows.filter(r => r.id !== oldId);
        renderAll();
        return;
      }
      const row = payload.new;
      if (!row) return;
      if (!studentNames.includes(row.student_name)) studentNames.push(row.student_name);
      const idx = allRows.findIndex(r => r.id === row.id);
      if (idx >= 0) allRows[idx] = row; else allRows.push(row);
      renderAll();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'groups', filter: `group_id=eq.${groupId}` }, (payload) => {
      if (payload.new?.student_names){
        payload.new.student_names.forEach(n => { if (!studentNames.includes(n)) studentNames.push(n); });
        renderAll();
      }
    })
    .subscribe();
}

if (GROUP_ID){
  loadGroup(GROUP_ID);
} else {
  document.getElementById('join-prompt').style.display = 'block';
  document.getElementById('join-btn').addEventListener('click', () => {
    const val = document.getElementById('join-input').value.trim();
    if (val){
      history.replaceState(null, '', `?group=${encodeURIComponent(val)}`);
      loadGroup(val);
    }
  });
}
</script>
</body>
